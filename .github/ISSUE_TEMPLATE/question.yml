# géré par profil-github (modeles-issues.mjs) : ne pas modifier à la main
name: Question
description: Demande d'aide ou d'information
labels: ["question", "à trier"]
body:
  - type: textarea
    id: question
    attributes:
      label: "Ta question"
    validations:
      required: true
  - type: textarea
    id: essaye
    attributes:
      label: "Ce que tu as déjà essayé"
    validations:
      required: false
  - type: input
    id: plateforme
    attributes:
      label: "Plateforme"
      description: "YouTube, TikTok…"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: "Version de Python et système"
    validations:
      required: true
