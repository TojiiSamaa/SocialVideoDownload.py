# géré par profil-github (modeles-issues.mjs) : ne pas modifier à la main
name: Bug
description: Quelque chose ne fonctionne pas
labels: ["bug", "à trier"]
body:
  - type: textarea
    id: attendu
    attributes:
      label: "Comportement attendu"
    validations:
      required: true
  - type: textarea
    id: observe
    attributes:
      label: "Comportement observé"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Étapes pour reproduire"
      description: "Numérotées, la plus courte possible"
    validations:
      required: true
  - type: input
    id: plateforme
    attributes:
      label: "Plateforme"
      description: "YouTube, TikTok…"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: "Version de Python et système"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Journaux"
      description: "Sans lien privé ni identifiant"
      render: shell
    validations:
      required: false
